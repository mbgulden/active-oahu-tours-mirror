<style>.sub-menu{display:none}</style>
<script>
// Nav dropdown toggle - vanilla JS
document.addEventListener('DOMContentLoaded', function() {
  // Hide all sub-menus on load (CSS override workaround)
  document.querySelectorAll('.sub-menu').forEach(function(s) {
    s.style.display = 'none';
  });
  document.querySelectorAll('.menu-item-has-children > a').forEach(function(link) {
    link.addEventListener('click', function(e) {
      var li = this.parentElement;
      var sub = li.querySelector(':scope > .sub-menu');
      if (sub) {
        e.preventDefault();
        var isVisible = sub.style.display !== 'none';
        li.parentElement.querySelectorAll(':scope > .menu-item-has-children > .sub-menu').forEach(function(s) {
          if (s !== sub) s.style.display = 'none';
        });
        sub.style.display = isVisible ? 'none' : 'block';
      }
    });
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.menu-item-has-children')) {
      document.querySelectorAll('.sub-menu').forEach(function(s) {
        s.style.display = 'none';
      });
    }
  });
});
