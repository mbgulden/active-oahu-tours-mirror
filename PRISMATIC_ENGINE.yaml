# PRISMATIC ENGINE — Workspace Governance
# Installed: 2026-06-23 by Fred (per GRO-2224)
# Repo: active-oahu-tours-mirror

version: 1

agents:
  fred:
    role: Orchestrator & Infrastructure
    lanes:
      owner: ["*"]
      read_only: []
    branch_prefix: "feature/"
    staging_governor: true

  kai:
    role: Orchestrator of Tourism — owns ALL Hawaii tour businesses (AOT flagship + future)
    lanes:
      owner:
        - "content/"
        - "active-oahu/"
        - "site/"          # AOT static site body content
        - "okf/"           # ops-runbook, knowledge hub
        - "scripts/"       # co-owned with Ned
        - "astro/"         # Astro homepage project — Kai owns AOT content/UX
      read_only: []
    branch_prefix: "content/"

  agy:
    role: Designer & Research
    lanes:
      owner: ["assets/", "designs/", "reports/"]
      read_only: ["src/", "content/", "active-oahu/"]
    branch_prefix: "design/"

  jules:
    role: PR Auditor
    lanes:
      owner: ["docs/"]
      read_only: ["*"]
    branch_prefix: "jules/"

  ned:
    role: Code Execution & Infrastructure
    lanes:
      owner: ["src/", "infra/", "deploy/", "scripts/"]
      read_only: ["content/"]
    branch_prefix: "ned/"

locks:
  file: "${PRISMATIC_HOME}/.antigravity/swarm_locks.json"
  heartbeat_interval_s: 60
  heartbeat_ttl_ms: 300000

staging:
  governor: "fred"
  branch: "deploy-fresh"
  # IMPORTANT: live production/source-of-truth must be verified before site edits.
  # Historical drift: master contains pages that main/root Pages did not serve.
  # Use scripts/aot_branch_drift_guard.py + live curl checks before restoration/merge.
  production_branch_verified_by_live_check: false
  production_branch_candidate: "main"
  content_source_branch_candidate: "master"

commit:
  # Per-agent prefixes (must match the [Agent] tag on each commit)
  prefixes:
    fred: "[Fred] description (#ISSUE)"
    kai:  "[Kai] description (#ISSUE)"
    agy:  "[AGY] description (#ISSUE)"
    jules: "[Jules] description (#ISSUE)"
    ned:  "[Ned] description (#ISSUE)"
  require_issue_ref: true
  note: "Multi-agent lane precedence: more-specific lane wins over '*'' (Fred's default). E.g. site/ belongs to Kai even though Fred owns '*'."

site_management:
  standards: "docs/AOT_SITE_MANAGEMENT_STANDARDS.md"
  prismatic_web_governance: "docs/PRISMATIC_WEB_GOVERNANCE_SYSTEM.md"
  governance_config: ".prismatic-web-governance.json"
  governance_guard: "scripts/prismatic_web_governance.py"
  drift_guard: "scripts/aot_branch_drift_guard.py"
  no_blind_main_master_merges: true
  no_claiming_staging_or_production_state_without_guard_report: true
