# PRISMATIC ENGINE — Workspace Governance
# Repo: active-oahu-tours-mirror / active-oahu-static
# Updated: 2026-06-12 (GRO-1484 — branch-based workflow + locking)
#
# This file governs how AI agents collaborate on this repository.
# Every agent MUST respect lane assignments, branch conventions, and locking protocol.
# Enforced by the Git pre-push hook (scripts/pre-push-hook.py).

version: 1

agents:
  fred:
    role: Orchestrator & Staging Governor
    lanes:
      owner: ["*"]  # Fred owns everything — review gate
      read_only: []
    branch_prefix: "feature/"
    staging_governor: true

  kai:
    role: Hawaii Tourism & Content Specialist
    lanes:
      owner: ["site/", "_seo/"]
      read_only: ["scripts/"]
    branch_prefix: "kai/"

  ned:
    role: Code Execution & Infrastructure
    lanes:
      owner: ["scripts/", "prismatic/", "plugins/"]
      read_only: ["site/", "_seo/"]
    branch_prefix: "ned/"

  agy:
    role: SEO Auditor & Researcher
    lanes:
      owner: ["_seo/", "designs/", "reports/"]
      read_only: ["site/", "scripts/"]
    branch_prefix: "agy/"

  jules:
    role: PR Auditor & Documentation
    lanes:
      owner: ["docs/", "README.md"]
      read_only: ["site/", "_seo/"]
    branch_prefix: "jules/"

locks:
  file: "/home/ubuntu/.antigravity/swarm_locks.json"
  heartbeat_interval_s: 60
  heartbeat_ttl_ms: 300000  # 5-minute stale timeout

staging:
  governor: "fred"
  branch: "deploy-fresh"
  production_branch: "master"  # AOT deploys to CF Pages on push to master

commit:
  prefix_format: "[AGENT] description (#ISSUE)"
  example: "[Kai] Add mokulua islands tour page (#GRO-1484)"

# ── Providers & Fallback (GRO-1476) ────────────────────
providers:
  default: google-antigravity
  fallback_chain: [claude-code]

# ── Credit & Budget Policies (GRO-1476) ────────────────
policies:
  global:
    monthly_budget: 10000
    hard_stop_at: 9000
