# PRISMATIC ENGINE — Workspace Governance
# Phase 1: Convention Layer
# Converted: 2026-06-14 by Jules (GRO-1561)
# Repo: active-oahu-tours-mirror
#
# This file governs how AI agents collaborate on this repository.
# Every agent MUST respect lane assignments, branch conventions, and locking protocol.
# Enforced by the Git pre-push hook (GRO-1315).
version: 1.0.0
agents:
  fred:
    role: Orchestrator & Staging Governor
    lanes:
      owner:
      - '*'
      read_only: []
    branch_prefix: feature/
    staging_governor: true
  kai:
    role: Hawaii Tourism & Content Specialist
    lanes:
      owner:
      - site/
      - _seo/
      read_only:
      - scripts/
    branch_prefix: kai/
  ned:
    role: Code Execution & Infrastructure
    lanes:
      owner:
      - scripts/
      - prismatic/
      - plugins/
      read_only:
      - site/
      - _seo/
    branch_prefix: ned/
  agy:
    role: SEO Auditor & Researcher
    lanes:
      owner:
      - _seo/
      - designs/
      read_only:
      - site/
      - scripts/
    branch_prefix: agy/
  jules:
    role: PR Auditor & Documentation
    lanes:
      owner:
      - docs/
      - README.md
      read_only:
      - site/
      - _seo/
    branch_prefix: jules/
staging:
  governor: fred
  branch: deploy-fresh
locks:
  file: .antigravity/swarm_locks.json
  heartbeat_interval_s: 60
  heartbeat_ttl_ms: 300000
commit:
  prefix_format: '[Agent] description (#ISSUE)'
  require_issue_ref: true
providers:
  default: google-antigravity
  fallback_chain:
  - claude-code
pipeline:
  phase1_development:
    stages:
    - worker_implementation
    - self_validation_loop
    - peer_review
    - fix_application
    - orchestrator_approval
  phase2_post_publish:
    trigger: github_push_detected
    stages:
    - active_review
    - read_only_review
    - apply_suggestions
    - publish_and_validate
policies:
  global:
    monthly_budget: 10000
    hard_stop_at: 9000
