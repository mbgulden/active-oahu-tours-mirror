# PRISMATIC ENGINE — Workspace Governance
# Installed: 2026-06-23 by Fred (per GRO-2224)
# Repo: active-oahu-tours-mirror

version: 1

agents:
  fred:
    role: Orchestrator & Infrastructure
    lanes:
      owner: ["*"]
      read_only: []
    branch_prefix: "feature/"
    staging_governor: true

  kai:
    role: Content Writer (AOT site)
    lanes:
      owner: ["content/", "active-oahu/", "okf/"]
      read_only: ["src/", "infra/", "deploy/"]
    branch_prefix: "content/"

  agy:
    role: Designer & Research
    lanes:
      owner: ["assets/", "designs/", "reports/"]
      read_only: ["src/", "content/", "active-oahu/"]
    branch_prefix: "design/"

  jules:
    role: PR Auditor
    lanes:
      owner: ["docs/"]
      read_only: ["*"]
    branch_prefix: "jules/"

  ned:
    role: Code Execution & Infrastructure
    lanes:
      owner: ["src/", "infra/", "deploy/", "scripts/"]
      read_only: ["content/"]
    branch_prefix: "ned/"

locks:
  file: "${PRISMATIC_HOME}/.antigravity/swarm_locks.json"
  heartbeat_interval_s: 60
  heartbeat_ttl_ms: 300000

staging:
  governor: "fred"
  branch: "deploy-fresh"
  production_branch: "master"

commit:
  prefix_format: "[Fred] description (#ISSUE)"
  require_issue_ref: true
